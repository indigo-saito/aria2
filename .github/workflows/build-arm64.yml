name: build-arm64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build aria2 for ARM64
      run: |
        # Dockerfileを使用してARM64向けにビルド
        docker run --rm \
          --platform linux/arm64 \
          -v $(pwd):/source \
          -w /source \
          ubuntu:latest \
          bash -c '
            apt-get update && \
            apt-get install -y \
              build-essential \
              autoconf \
              automake \
              autotools-dev \
              autopoint \
              libtool \
              pkg-config \
              libssl-dev \
              libgnutls28-dev \
              libc-ares-dev \
              zlib1g-dev \
              libsqlite3-dev \
              libssh2-1-dev \
              gettext && \
            autoreconf -i && \
            ./configure \
              --prefix=/usr/local \
              --with-openssl \
              --without-gnutls && \
            make -j$(nproc) && \
            mkdir -p /source/aria2-arm64-linux && \
            cp src/aria2c /source/aria2-arm64-linux/
          '

    - name: Create package
      run: |
        tar -czf aria2-arm64-linux.tar.gz aria2-arm64-linux/

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: aria2-arm64-linux.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: aria2-arm64-linux
        path: aria2-arm64-linux/

